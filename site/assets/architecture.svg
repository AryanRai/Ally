<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">How Ally connects</title>
  <desc id="desc">An Android phone and a Wear OS watch connect to an authenticated bridge on the desktop. Ally desktop (floating pill, top notch and chat search) connects to Claude Code or Codex, to local or configured cloud speech, and to signed-in Codex accounts that share one chat history and switch automatically at usage limits.</desc>
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB347"/><stop offset="0.5" stop-color="#FF6B35"/><stop offset="1" stop-color="#F72585"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.28"/><stop offset="1" stop-color="#F72585" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M0 0 7 3.5 0 7Z" fill="rgba(255,255,255,0.45)"/>
    </marker>
  </defs>
  <style>
    .card { fill: rgba(0,0,0,0.6); stroke: rgba(255,255,255,0.16); }
    .label { fill: #fff; font: 500 12px Geist, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 1.8px; text-transform: uppercase; }
    .detail { fill: rgba(255,255,255,0.5); font: 400 11px 'Geist Mono', ui-monospace, Consolas, monospace; letter-spacing: 0.6px; }
    .eyebrow { fill: rgba(255,255,255,0.4); font: 400 10px 'Geist Mono', ui-monospace, Consolas, monospace; letter-spacing: 3px; }
    .wire { stroke: rgba(255,255,255,0.35); stroke-width: 1.2; }
  </style>
  <text class="eyebrow" x="20" y="35">ONE DESKTOP · CONNECTED CONVERSATIONS</text>
  <ellipse cx="605" cy="177" rx="170" ry="110" fill="url(#glow)"/>
  <g class="wire" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M184 115C220 115 222 160 256 160"/>
    <path d="M184 225C220 225 222 195 256 195"/>
    <path d="M454 177H506"/>
    <path d="M704 177H756"/>
    <path d="M605 224V291"/>
    <path d="M850 224V291"/>
  </g>
  <rect class="card" x="20" y="80" width="160" height="70"/>
  <text class="label" x="100" y="110" text-anchor="middle">Android phone</text>
  <text class="detail" x="100" y="132" text-anchor="middle">chat · share · control</text>
  <rect class="card" x="20" y="190" width="160" height="70"/>
  <text class="label" x="100" y="220" text-anchor="middle">Wear OS watch</text>
  <text class="detail" x="100" y="242" text-anchor="middle">talk · always-on</text>
  <rect class="card" x="260" y="135" width="190" height="85"/>
  <text class="label" x="355" y="170" text-anchor="middle">Device bridge</text>
  <text class="detail" x="355" y="193" text-anchor="middle">authenticated · any network</text>
  <rect x="510" y="135" width="190" height="85" rx="42.5" fill="rgba(20,20,24,0.8)" stroke="url(#sun)" stroke-width="1.4"/>
  <circle cx="545" cy="177.5" r="14" fill="url(#sun)"/>
  <text class="label" x="620" y="172" text-anchor="middle">Ally desktop</text>
  <text class="detail" x="620" y="193" text-anchor="middle">pill · notch · search</text>
  <rect class="card" x="760" y="135" width="180" height="85"/>
  <text class="label" x="850" y="170" text-anchor="middle">Claude Code / Codex</text>
  <text class="detail" x="850" y="193" text-anchor="middle">native agents and tools</text>
  <rect class="card" x="510" y="295" width="190" height="60"/>
  <text class="label" x="605" y="321" text-anchor="middle">Speech</text>
  <text class="detail" x="605" y="341" text-anchor="middle">local / configured cloud</text>
  <rect class="card" x="760" y="295" width="180" height="60"/>
  <text class="label" x="850" y="321" text-anchor="middle">Codex accounts</text>
  <text class="detail" x="850" y="341" text-anchor="middle">shared history · auto-switch</text>
  <text class="detail" x="20" y="372">Keep the PC and Ally online.</text>
</svg>
